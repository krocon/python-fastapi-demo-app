syntax = "proto3";

package user;

message ItemMessage {
  int32 id = 1;
  string title = 2;
  string description = 3;
  double price = 4;
  int32 owner_id = 5;
}

message UserMessage {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  bool is_active = 5;
  string created_at = 6;
  repeated ItemMessage items = 7;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string role = 3;
}

message CreateItemRequest {
  string title = 1;
  string description = 2;
  double price = 3;
  int32 owner_id = 4;
}

message UserListResponse {
  repeated UserMessage users = 1;
  int32 total = 2;
}
