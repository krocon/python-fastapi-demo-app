[project]
name = "python-fastapi-demo-app"
version = "1.0.0"
description = "A small, self-contained REST API built with FastAPI – the Python counterpart of kotlin-ktor-demo-app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # FastAPI + Uvicorn server + `fastapi dev` CLI. >= 0.135 for built-in Server-Sent Events.
    "fastapi[standard]>=0.135",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2", # used by FastAPI's TestClient
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
